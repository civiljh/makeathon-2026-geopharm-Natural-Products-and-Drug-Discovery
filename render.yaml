services:
  - type: web
    name: geopharm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEOPHARM_ENABLE_PLANT_PIPELINE
        value: "ture"
      - key: GEOPHARM_ENABLE_DISEASE_PREDICTIONS
        value: "true"
